<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ashish ❤️ Madhu</title>
  <!-- Google Fonts for romantic typography -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px);
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      position: relative;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
    }

    /* Responsive Glass Card */
    .card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: clamp(32px, 7vh, 65px) clamp(24px, 6vw, 55px);
      border-radius: clamp(20px, 4vw, 28px);
      box-shadow: 0 15px 35px rgba(214, 51, 108, 0.22);
      text-align: center;
      width: min(90vw, 420px);
      max-height: 85dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      border: 2px solid rgba(255, 255, 255, 0.95);
      animation: fadeIn 1.2s ease-in-out;
    }

    /* Fluid Names Scaling */
    .name {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2.8rem, 9vw, 4.2rem);
      line-height: 1.15;
      color: #d6336c;
      text-shadow: 2px 2px 4px rgba(214, 51, 108, 0.15);
      word-break: break-word;
    }

    /* Fluid Beating Heart */
    .heart {
      font-size: clamp(2.4rem, 7vw, 3.6rem);
      margin: clamp(12px, 3vh, 22px) 0;
      display: inline-block;
      animation: heartbeat 1.2s infinite;
    }

    /* Responsive Music Toggle Button */
    .music-btn {
      position: fixed;
      top: max(16px, env(safe-area-inset-top, 16px));
      right: max(16px, env(safe-area-inset-right, 16px));
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.95);
      border-radius: 50%;
      width: clamp(42px, 6vw, 50px);
      height: clamp(42px, 6vw, 50px);
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(214, 51, 108, 0.2);
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s ease;
    }

    .music-btn:hover {
      transform: scale(1.08);
    }

    /* Responsive Tap Hint */
    .tap-hint {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom, 20px));
      font-size: clamp(0.8rem, 2.5vw, 0.95rem);
      color: #b5174d;
      background: rgba(255, 255, 255, 0.8);
      padding: 8px 18px;
      border-radius: 25px;
      box-shadow: 0 4px 12px rgba(214, 51, 108, 0.12);
      z-index: 15;
      animation: pulseHint 2s infinite;
      pointer-events: none;
      white-space: nowrap;
    }

    /* Floating Background Hearts */
    .bg-heart {
      position: absolute;
      bottom: -50px;
      opacity: 0.65;
      animation: floatUp 6s linear infinite;
      pointer-events: none;
      will-change: transform, opacity;
    }

    /* Landscape Mobile Adjustment */
    @media (max-height: 480px) and (orientation: landscape) {
      .card {
        padding: 18px 36px;
        width: min(75vw, 380px);
      }
      .name {
        font-size: 2.4rem;
      }
      .heart {
        font-size: 2rem;
        margin: 6px 0;
      }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.25); }
      50% { transform: scale(1); }
      75% { transform: scale(1.15); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseHint {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Cross-Platform Audio Player -->
  <audio id="bgMusic" loop playsinline preload="auto">
    <source src="song.mp3" type="audio/mpeg">
  </audio>

  <!-- Corner Music Mute/Play Button -->
  <button class="music-btn" id="musicBtn" aria-label="Toggle Music" title="Play/Pause Music">🔇</button>

  <!-- Main Card -->
  <div class="card">
    <div class="name">Ashish</div>
    <div class="heart">❤️</div>
    <div class="name">Madhu</div>
  </div>

  <!-- Tap Hint -->
  <div class="tap-hint" id="tapHint">Tap anywhere for music 🎵</div>

  <script>
    const music = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');
    const tapHint = document.getElementById('tapHint');
    let isPlaying = false;
    let lastInteraction = 0;

    function startAudio() {
      if (!isPlaying) {
        music.play().then(() => {
          isPlaying = true;
          musicBtn.innerText = '🎵';
          if (tapHint) tapHint.style.display = 'none';
        }).catch(() => {});
      }
    }

    function handleInteraction(e) {
      // Ignore if clicking the dedicated music toggle button
      if (e.target.closest('#musicBtn')) return;

      // Prevent duplicate firing on mobile devices (touchstart + click)
      const now = Date.now();
      if (now - lastInteraction < 250) return;
      lastInteraction = now;

      // Burst extra hearts
      for (let i = 0; i < 10; i++) {
        createHeart();
      }

      startAudio();
    }

    // Listen to both mobile touch and desktop click
    document.body.addEventListener('touchstart', handleInteraction, { passive: true });
    document.body.addEventListener('click', handleInteraction);

    // Dedicated Music Toggle Button
    musicBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      if (isPlaying) {
        music.pause();
        isPlaying = false;
        musicBtn.innerText = '🔇';
      } else {
        music.play().then(() => {
          isPlaying = true;
          musicBtn.innerText = '🎵';
          if (tapHint) tapHint.style.display = 'none';
        }).catch(() => {});
      }
    });

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('bg-heart');
      const emojis = ['❤️', '💖', '💕', '💗', '💓'];
      heart.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      heart.style.left = (Math.random() * 94 + 2) + 'vw';
      heart.style.animationDuration = (Math.random() * 3 + 3.5) + 's';
      heart.style.fontSize = (Math.random() * 1.2 + 1) + 'rem';
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6500);
    }

    // Continuously generate gentle floating hearts
    setInterval(createHeart, 650);
  </script>

</body>
</html>
