<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashish 💛 Madhu</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none}
  body{height:100dvh;display:flex;justify-content:center;align-items:center;overflow:hidden;cursor:pointer;perspective:1000px;font-family:'Poppins',sans-serif;background:radial-gradient(circle,rgba(255,255,255,.9) 1.5px,transparent 2px) 0 0/24px 24px,radial-gradient(circle,rgba(212,175,55,.6) 1.5px,transparent 2px) 12px 12px/30px 30px,radial-gradient(circle,#fffdf7,#f5e2b8,#e4c17a);animation:bg 3s linear infinite}
  .card{position:relative;width:min(85vw,350px);padding:34px 24px;border-radius:26px;border:2px solid #c99a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transform-style:preserve-3d;animation:float3d 5s ease-in-out infinite,bg 2.5s linear infinite;box-shadow:0 8px 0 #b8860b,0 14px 0 #8a6205,0 25px 40px rgba(120,82,10,.35);background:radial-gradient(circle,rgba(212,175,55,.4) 1.5px,transparent 2px) 0 0/18px 18px,radial-gradient(circle,rgba(255,223,100,.8) 1.5px,transparent 2px) 9px 9px/24px 24px,linear-gradient(145deg,#fff,#fcf4e1)}
  .card::before{content:"";position:absolute;inset:10px;border-radius:18px;border:1.5px solid rgba(201,154,46,.5);pointer-events:none}
  .name{font-family:'Great Vibes',cursive;font-size:clamp(3.2rem,10vw,4.3rem);line-height:1.1;padding:0 12px;transform:translateZ(35px);background:radial-gradient(circle,#fffbe0 1.2px,transparent 1.6px) 0 0/12px 12px,radial-gradient(circle,#ffd700 1.5px,transparent 2px) 6px 6px/16px 16px,linear-gradient(110deg,#6e4500,#b8860b,#ffea75,#a67508,#6e4500) 200% 0/200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 3px rgba(110,69,0,.4));animation:shine 2.2s linear infinite}
  .heart{margin:4px 0;display:inline-flex;transform:translateZ(55px);animation:beat 1.3s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(138,90,0,.45))}
  .btn{position:fixed;top:16px;right:16px;width:44px;height:44px;border-radius:50%;border:2px solid #c99a2e;background:#fffdf8;font-size:1.2rem;cursor:pointer;z-index:10}
  .hint{position:fixed;bottom:20px;padding:8px 18px;border-radius:20px;border:1.5px solid #c99a2e;background:rgba(255,253,248,.95);color:#7a4e00;font-size:.85rem;pointer-events:none}
  .f{position:fixed;bottom:-30px;animation:up 6s linear infinite;pointer-events:none}
  @keyframes bg{to{background-position:24px 24px,42px 42px,center}}
  @keyframes shine{to{background-position:24px 24px,32px 32px,0% 0}}
  @keyframes float3d{0%,100%{transform:rotateX(6deg) rotateY(-8deg)}50%{transform:rotateX(-5deg) rotateY(8deg)}}
  @keyframes beat{0%,100%{transform:translateZ(55px) scale(1)}50%{transform:translateZ(55px) scale(1.18)}}
  @keyframes up{0%{transform:translateY(0);opacity:0}20%,80%{opacity:.85}100%{transform:translateY(-110vh);opacity:0}}
</style>
</head>
<body onclick="var m=document.getElementById('m');if(m.paused){m.play();document.getElementById('b').innerText='🎵';document.getElementById('h').style.display='none'}">
  <audio id="m" autoplay loop playsinline><source src="song.mp3" type="audio/mpeg"></audio>
  <button id="b" class="btn" onclick="event.stopPropagation();var m=document.getElementById('m');if(m.paused){m.play();this.innerText='🎵';document.getElementById('h').style.display='none'}else{m.pause();this.innerText='🔇'}">🔇</button>
  <span class="f" style="left:15%">💛</span><span class="f" style="left:35%;animation-delay:2s">✨</span><span class="f" style="left:65%;animation-delay:1s">💛</span><span class="f" style="left:85%;animation-delay:3s">✨</span>
  <div class="card">
    <div class="name">Ashish</div>
    <div class="heart"><svg width="52" height="48" viewBox="0 0 32 29.6"><defs><radialGradient id="g" cx="32%" cy="28%" r="70%"><stop offset="0%" stop-color="#fff9cc"/><stop offset="30%" stop-color="#f7d060"/><stop offset="70%" stop-color="#c99316"/><stop offset="100%" stop-color="#6e4700"/></radialGradient></defs><path fill="url(#g)" d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/></svg></div>
    <div class="name">Madhu</div>
  </div>
  <div id="h" class="hint">Tap anywhere for music ✨</div>
</body>
</html>
