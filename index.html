<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ashish ❤️ Madhu</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { width: 100%; height: 100%; min-height: 100vh; min-height: 100dvh; overflow: hidden; background: #060714; }
    body { display: flex; justify-content: center; align-items: center; padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px); position: relative; font-family: 'Poppins', sans-serif; perspective: 1000px; }
    
    #fireworksCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

    .card-wrapper { z-index: 10; width: min(88vw, 400px); display: flex; justify-content: center; align-items: center; pointer-events: none; }
    .card { position: relative; overflow: hidden; background: rgba(15, 17, 32, 0.58); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: clamp(30px, 6.5vh, 60px) clamp(24px, 6vw, 50px); border-radius: clamp(20px, 4vw, 28px); text-align: center; width: 100%; max-height: 85dvh; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 2px solid rgba(255, 105, 180, 0.75); transform-style: preserve-3d; animation: fadeIn 1.2s ease-in-out, neonCardBlink 1.8s ease-in-out infinite alternate, auto3DFloat 6s ease-in-out infinite; }
    
    .glare { position: absolute; top: -50%; left: -150%; width: 80%; height: 200%; background: linear-gradient(to right, transparent 0%, rgba(255, 255, 255, 0.22) 50%, transparent 100%); transform: rotate(25deg); animation: autoGlareSweep 4s ease-in-out infinite; pointer-events: none; }

    .name { font-family: 'Dancing Script', cursive; font-size: clamp(2.8rem, 9vw, 4.2rem); line-height: 1.15; color: #ffb3c6; word-break: break-word; transform: translateZ(35px); animation: neonTextBlink 1.8s ease-in-out infinite alternate; }
    .heart { font-size: clamp(2.4rem, 7vw, 3.6rem); margin: clamp(12px, 3vh, 22px) 0; display: inline-block; filter: drop-shadow(0 0 18px rgba(255, 50, 100, 0.95)); animation: heartbeat 1.1s infinite; transform: translateZ(50px); }

    .bg-heart { position: fixed; bottom: -50px; opacity: 0.9; filter: drop-shadow(0 0 10px rgba(255, 105, 180, 0.75)); animation: floatUp linear forwards; pointer-events: none; will-change: transform, opacity; z-index: 5; }

    .music-btn { position: fixed; top: max(16px, env(safe-area-inset-top, 16px)); right: max(16px, env(safe-area-inset-right, 16px)); background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(8px); border: 1.5px solid rgba(255, 182, 193, 0.5); border-radius: 50%; width: clamp(42px, 6vw, 50px); height: clamp(42px, 6vw, 50px); font-size: clamp(1.1rem, 3vw, 1.4rem); color: #fff; cursor: pointer; box-shadow: 0 0 18px rgba(255, 105, 180, 0.45); z-index: 20; display: flex; justify-content: center; align-items: center; transition: transform 0.2s ease; }
    .music-btn:hover { transform: scale(1.08); }

    @media (max-height: 480px) and (orientation: landscape) {
      .card { padding: 18px 36px; }
      .card-wrapper { width: min(75vw, 380px); }
      .name { font-size: 2.4rem; }
      .heart { font-size: 2rem; margin: 6px 0; }
    }

    @keyframes auto3DFloat {
      0%, 100% { transform: rotateX(4deg) rotateY(-6deg); }
      50% { transform: rotateX(-4deg) rotateY(6deg); }
    }
    @keyframes autoGlareSweep {
      0% { left: -150%; }
      50% { left: 160%; }
      100% { left: 160%; }
    }
    @keyframes neonCardBlink {
      0% { border-color: rgba(255, 105, 180, 0.35); box-shadow: 0 0 15px rgba(255, 105, 180, 0.2); }
      100% { border-color: rgba(255, 130, 195, 1); box-shadow: 0 0 42px rgba(255, 105, 180, 0.7), 0 0 80px rgba(255, 20, 147, 0.4); }
    }
    @keyframes neonTextBlink {
      0% { color: #ff85a2; text-shadow: 0 0 8px rgba(255, 105, 180, 0.5); }
      100% { color: #ffd6e0; text-shadow: 0 0 16px rgba(255, 105, 180, 1), 0 0 34px rgba(255, 20, 147, 0.85); }
    }
    @keyframes heartbeat { 0%, 100% { transform: translateZ(50px) scale(1); } 25% { transform: translateZ(50px) scale(1.28); } 50% { transform: translateZ(50px) scale(1); } 75% { transform: translateZ(50px) scale(1.18); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg) scale(0.85); opacity: 0.95; } 100% { transform: translateY(-115vh) rotate(360deg) scale(1.15); opacity: 0; } }
  </style>
</head>
<body>
  <audio id="bgMusic" autoplay loop playsinline preload="auto"><source src="song.mp3" type="audio/mpeg"></audio>
  <button class="music-btn" id="musicBtn" aria-label="Toggle Music" title="Play/Pause Music">🔇</button>
  <canvas id="fireworksCanvas"></canvas>

  <div class="card-wrapper">
    <div class="card">
      <div class="glare"></div>
      <div class="name">Ashish</div>
      <div class="heart">❤️</div>
      <div class="name">Madhu</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');
    const music = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');

    let width, height;
    let isPlaying = false;

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const stars = Array.from({ length: 110 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 1.6 + 0.4,
      alpha: Math.random(),
      speed: Math.random() * 0.02 + 0.005
    }));

    const particles = [];
    const rockets = [];
    const colors = ['#ff2a6d', '#ff69b4', '#ff9ebb', '#ffd700', '#ff4d6d', '#c77dff', '#ff758f'];

    function createHeartFirework(x, y) {
      const color = colors[Math.floor(Math.random() * colors.length)];
      const secondaryColor = colors[Math.floor(Math.random() * colors.length)];
      const count = 80;
      const scale = Math.min(width, height) * 0.0095 + 4.5;

      for (let i = 0; i < count; i++) {
        const t = (Math.PI * 2 * i) / count;
        const hx = 16 * Math.pow(Math.sin(t), 3);
        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        
        const speedSpread = 0.85 + Math.random() * 0.35;
        particles.push({
          x: x,
          y: y,
          vx: (hx * scale * 0.036) * speedSpread,
          vy: (hy * scale * 0.036) * speedSpread,
          alpha: 1,
          decay: Math.random() * 0.011 + 0.01,
          color: i % 2 === 0 ? color : secondaryColor,
          size: Math.random() * 2.5 + 1.8
        });
      }
    }

    function launchRocket(targetX, targetY) {
      const startX = targetX !== undefined ? targetX + (Math.random() * 60 - 30) : Math.random() * (width * 0.8) + width * 0.1;
      const destX = targetX !== undefined ? targetX : startX + (Math.random() * 80 - 40);
      const destY = targetY !== undefined ? targetY : Math.random() * (height * 0.45) + height * 0.12;
      
      rockets.push({
        x: startX,
        y: height,
        tx: destX,
        ty: destY,
        vx: (destX - startX) / 32,
        vy: (destY - height) / 32,
        color: colors[Math.floor(Math.random() * colors.length)],
        trail: []
      });
    }

    function animate() {
      ctx.fillStyle = 'rgba(6, 7, 20, 0.22)';
      ctx.fillRect(0, 0, width, height);

      stars.forEach(s => {
        s.alpha += s.speed;
        if (s.alpha > 1 || s.alpha < 0.1) s.speed = -s.speed;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.1, s.alpha)})`;
        ctx.fill();
      });

      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.trail.push({ x: r.x, y: r.y });
        if (r.trail.length > 6) r.trail.shift();

        r.x += r.vx;
        r.y += r.vy;

        ctx.beginPath();
        r.trail.forEach((pt, idx) => {
          if (idx === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.strokeStyle = r.color;
        ctx.lineWidth = 2.5;
        ctx.stroke();

        if (r.y <= r.ty) {
          createHeartFirework(r.x, r.y);
          rockets.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.035;
        p.vx *= 0.985;
        p.vy *= 0.985;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.shadowBlur = 12;
        ctx.shadowColor = p.color;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      requestAnimationFrame(animate);
    }
    animate();

    // Automatic non-stop heart fireworks
    setTimeout(() => launchRocket(width * 0.25, height * 0.25), 200);
    setTimeout(() => launchRocket(width * 0.75, height * 0.25), 500);
    setTimeout(() => launchRocket(width * 0.5, height * 0.18), 800);
    setInterval(() => {
      launchRocket();
    }, 1100);

    // Automatic floating hearts shower
    function createFloatingHeart() {
const heart = document.createElement('div');
heart.classList.add('bg-heart');
const emojis = ['❤️', '💖', '💕', '💗', '✨'];
heart.innerText = emojis[Math.floor(Math.random() * emojis.length)];
heart.style.left = (Math.random() * 96 + 1) + 'vw';
const duration = Math.random() * 2.5 + 3.5;
heart.style.animationDuration = duration + 's';
heart.style.fontSize = (Math.random() * 1.2 + 0.9) + 'rem';
document.body.appendChild(heart);
setTimeout(() => { heart.remove(); }, duration * 1000);
}
for (let i = 0; i < 15; i++) {
setTimeout(createFloatingHeart, i * 180);
}
setInterval(createFloatingHeart, 320);
// Try automatic audio play on load, plus unlock on any touch/scroll/click
function tryPlayMusic() {
if (!isPlaying) {
music.play().then(() => {
isPlaying = true;
musicBtn.innerText = '🎵';
}).catch(() => {});
}
}
window.addEventListener('load', tryPlayMusic);
document.addEventListener('touchstart', tryPlayMusic, { once: true, passive: true });
document.addEventListener('click', tryPlayMusic, { once: true });
musicBtn.addEventListener('click', e => {
e.stopPropagation();
if (isPlaying) {
music.pause();
isPlaying = false;
musicBtn.innerText = '🔇';
} else {
music.play().then(() => {
isPlaying = true;
musicBtn.innerText = '🎵';
}).catch(() => {});
}
});
