<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ashish ❤️ Madhu</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { width: 100%; height: 100%; min-height: 100vh; min-height: 100dvh; overflow: hidden; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #fffdf7 0%, #f9eccb 50%, #f3d999 100%);
      position: relative;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
    }

    /* Simple Royal Golden Card */
    .card {
      position: relative;
      background: rgba(255, 253, 248, 0.94);
      padding: clamp(38px, 8vh, 68px) clamp(32px, 8vw, 62px);
      border-radius: 26px;
      border: 1.5px solid #d4af37;
      box-shadow: 0 15px 38px rgba(184, 134, 11, 0.16), inset 0 0 18px rgba(212, 175, 55, 0.08);
      text-align: center;
      width: min(86vw, 370px);
      z-index: 10;
      animation: fadeIn 1s ease;
    }

    /* Wrapper for Name + Sparkles */
    .name-box {
      position: relative;
      display: inline-block;
    }

    /* Golden Glitter Shimmer Text */
    .name {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(3rem, 9.5vw, 4.3rem);
      line-height: 1.25;
      background: linear-gradient(
        110deg,
        #8a5a00 10%,
        #d4af37 30%,
        #fff6b3 48%,
        #f7d060 55%,
        #b8860b 75%,
        #8a5a00 90%
      );
      background-size: 220% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 5px rgba(212, 175, 55, 0.35));
      animation: goldGlitter 2.8s linear infinite;
    }

    /* Tiny Twinkling Glitter Stars Around Names */
    .sparkle {
      position: absolute;
      color: #e5b822;
      font-size: 0.9rem;
      pointer-events: none;
      animation: twinkleSparkle 1.8s ease-in-out infinite;
    }
    .s1 { top: 6px; left: -14px; animation-delay: 0s; }
    .s2 { bottom: 10px; right: -14px; animation-delay: 0.6s; }
    .s3 { top: 8px; right: -12px; animation-delay: 1.1s; font-size: 0.75rem; }
    .s4 { bottom: 8px; left: -12px; animation-delay: 0.4s; font-size: 0.75rem; }

    .heart {
      font-size: clamp(2.2rem, 6vw, 3.2rem);
      margin: 14px 0;
      display: inline-block;
      animation: heartbeat 1.4s ease-in-out infinite;
    }

    /* Golden Music Button */
    .music-btn {
      position: fixed;
      top: max(18px, env(safe-area-inset-top, 18px));
      right: max(18px, env(safe-area-inset-right, 18px));
      background: rgba(255, 253, 248, 0.94);
      border: 1.5px solid #d4af37;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(184, 134, 11, 0.16);
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s ease;
    }

    .music-btn:hover {
      transform: scale(1.08);
    }

    /* Golden Music Instruction Pill */
    .music-hint {
      position: fixed;
      bottom: max(22px, env(safe-area-inset-bottom, 22px));
      font-size: clamp(0.8rem, 2.5vw, 0.92rem);
      font-weight: 500;
      color: #8a5a00;
      background: rgba(255, 253, 248, 0.9);
      border: 1.2px solid #d4af37;
      padding: 8px 18px;
      border-radius: 25px;
      box-shadow: 0 4px 14px rgba(184, 134, 11, 0.15);
      z-index: 15;
      animation: pulseHint 2s ease-in-out infinite;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.4s ease;
    }

    /* Gentle Floating Hearts & Sparkles */
    .bg-heart {
      position: fixed;
      bottom: -40px;
      opacity: 0.65;
      animation: floatUp linear forwards;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes goldGlitter {
      0% { background-position: 200% center; }
      100% { background-position: 0% center; }
    }
    @keyframes twinkleSparkle {
      0%, 100% { opacity: 0.15; transform: scale(0.7) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.25) rotate(25deg); text-shadow: 0 0 8px #ffd700; }
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.18); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseHint {
      0%, 100% { opacity: 0.7; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 0.7; }
      100% { transform: translateY(-110vh); opacity: 0; }
    }
  </style>
</head>
<body>
  <audio id="bgMusic" autoplay loop playsinline preload="auto"><source src="song.mp3" type="audio/mpeg"></audio>
  <button class="music-btn" id="musicBtn" aria-label="Toggle Music" title="Play/Pause Music">🔇</button>

  <div class="card">
    <div class="name-box">
      <span class="sparkle s1">✦</span>
      <span class="sparkle s2">✦</span>
      <div class="name">Ashish</div>
    </div>
    <br />
    <div class="heart">❤️</div>
    <br />
    <div class="name-box">
      <span class="sparkle s3">✦</span>
      <span class="sparkle s4">✦</span>
      <div class="name">Madhu</div>
    </div>
  </div>

  <div class="music-hint" id="musicHint">Tap anywhere for music ✨</div>

  <script>
    const music = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');
    const musicHint = document.getElementById('musicHint');
    let isPlaying = false;

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('bg-heart');
      const items = ['💛', '✨', '❤️'];
      heart.innerText = items[Math.floor(Math.random() * items.length)];
      heart.style.left = (Math.random() * 94 + 2) + 'vw';
      const duration = Math.random() * 3 + 5;
      heart.style.animationDuration = duration + 's';
      heart.style.fontSize = (Math.random() * 0.8 + 0.9) + 'rem';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), duration * 1000);
    }

    setInterval(createHeart, 850);

    function playMusic() {
      if (!isPlaying) {
        music.play().then(() => {
          isPlaying = true;
          musicBtn.innerText = '🎵';
          if (musicHint) {
            musicHint.style.opacity = '0';
            setTimeout(() => { musicHint.style.display = 'none'; }, 400);
          }
        }).catch(() => {});
      }
    }

    window.addEventListener('load', playMusic);
    document.addEventListener('touchstart', playMusic, { once: true, passive: true });
    document.addEventListener('click', playMusic, { once: true });

    musicBtn.addEventListener('click', e => {
      e.stopPropagation();
      if (isPlaying) {
        music.pause();
        isPlaying = false;
        musicBtn.innerText = '🔇';
      } else {
        music.play().then(() => {
          isPlaying = true;
          musicBtn.innerText = '🎵';
          if (musicHint) {
            musicHint.style.opacity = '0';
            setTimeout(() => { musicHint.style.display = 'none'; }, 400);
          }
        }).catch(() => {});
      }
    });
  </script>
</body>
</html>
