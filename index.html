इस चैट बॉक्स का सिस्टम <script> टैग देखते ही कोड बॉक्स को बीच में ही बंद कर देता है, जिसकी वजह से नीचे का कोड बॉक्स से बाहर निकल जाता है और कॉपी नहीं हो पाता।
इस समस्या को जड़ से खत्म करने के लिए, मैंने नीचे दिए गए कोड में <script> टैग का इस्तेमाल ही नहीं किया है! अब पूरा एनिमेशन, 3D इफ़ेक्ट और म्यूज़िक सीधे HTML और CSS से चलेगा—जिससे 100% पूरा कोड एक ही बॉक्स के अंदर रहेगा और बॉक्स से बाहर एक भी अक्षर नहीं निकलेगा।

ऐसे कॉपी और पेस्ट करें:

1. नीचे दिए गए बॉक्स के ऊपर दाईं ओर बने Copy बटन पर क्लिक करें।
2. GitHub पर index.html खोलें, सारा पुराना कोड डिलीट करें (Ctrl + A फिर Delete) और यह नया कोड पेस्ट करें (Ctrl + V)।
3. Commit changes करें और 1 मिनट बाद Ctrl + Shift + R दबाकर पेज रीफ्रेश करें।
html

<html lang="en">
<head>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { width: 100%; height: 100%; min-height: 100vh; min-height: 100dvh; overflow: hidden; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f3d999;
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 0.9) 1.2px, transparent 1.6px),
        radial-gradient(circle, rgba(212, 175, 55, 0.55) 1.5px, transparent 2px),
        radial-gradient(circle, rgba(255, 245, 180, 0.95) 1px, transparent 1.5px),
        radial-gradient(circle at center, #fffdf7 0%, #f5e2b8 55%, #e4c17a 100%);
      background-size: 26px 26px, 34px 34px, 19px 19px, 100% 100%;
      background-position: 0 0, 12px 15px, 6px 8px, center;
      animation: bgGlitterShimmer 3s linear infinite;
      position: relative;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      perspective: 1100px;
    }
    .card-wrapper {
      z-index: 10;
      width: min(88vw, 400px);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      position: relative;
      overflow: hidden;
      background-color: #fdf8ec;
      background-image:
        radial-gradient(circle, rgba(212, 175, 55, 0.38) 1.2px, transparent 1.6px),
        radial-gradient(circle, rgba(255, 223, 100, 0.75) 1.4px, transparent 1.8px),
        radial-gradient(circle, rgba(184, 134, 11, 0.25) 1px, transparent 1.5px),
        linear-gradient(145deg, #ffffff 0%, #fcf4e1 100%);
      background-size: 18px 18px, 25px 25px, 14px 14px, 100% 100%;
      background-position: 0 0, 9px 11px, 4px 6px, center;
      padding: clamp(36px, 7vh, 62px) clamp(28px, 7vw, 56px);
      border-radius: 28px;
      border: 2px solid #c99a2e;
      box-shadow:
        0 8px 0 #b8860b,
        0 14px 0 #8a6205,
        0 28px 45px rgba(120, 82, 10, 0.35),
        inset 0 0 28px rgba(212, 175, 55, 0.22);
      text-align: center;
      width: 100%;
      transform-style: preserve-3d;
      transition: transform 0.3s ease;
      animation: auto3DFloat 5s ease-in-out infinite, cardGlitterShimmer 2.5s linear infinite;
    }
    .card:hover, .card:active {
      transform: rotateX(8deg) rotateY(10deg) scale(1.03);
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 20px;
      border: 1.5px solid rgba(201, 154, 46, 0.5);
      pointer-events: none;
    }
    .card::after {
      content: "";
      position: absolute;
      top: -50%;
      left: -150%;
      width: 80%;
      height: 200%;
      background: linear-gradient(to right, transparent 0%, rgba(255, 250, 210, 0.55) 50%, transparent 100%);
      transform: rotate(25deg);
      animation: glareSweep 4s ease-in-out infinite;
      pointer-events: none;
    }
    .name-box {
      position: relative;
      display: inline-block;
      transform: translateZ(35px);
    }
    .name {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(3.6rem, 11.5vw, 5rem);
      font-weight: 400;
      line-height: 1.2;
      padding: 0 14px;
      background-image:
        radial-gradient(circle, #fffbe0 1.2px, transparent 1.6px),
        radial-gradient(circle, #ffd700 1.5px, transparent 2px),
        radial-gradient(circle, #6e4500 1.2px, transparent 1.8px),
        linear-gradient(110deg, #6e4500 0%, #b8860b 25%, #ffea75 48%, #a67508 72%, #6e4500 100%);
      background-size: 14px 14px, 19px 19px, 11px 11px, 220% auto;
      background-position: 0 0, 7px 9px, 4px 3px, 200% center;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 3px rgba(110, 69, 0, 0.4)) drop-shadow(0 0 8px rgba(255, 215, 0, 0.5));
      animation: heavyGlitter 2.4s linear infinite;
    }
    .sparkle {
      position: absolute;
      color: #d49b1a;
      font-size: 1.15rem;
      pointer-events: none;
      animation: twinkleSparkle 1.4s ease-in-out infinite;
    }
    .s1 { top: 2px; left: -10px; animation-delay: 0s; }
    .s2 { bottom: 6px; right: -10px; animation-delay: 0.4s; }
    .s3 { top: 4px; right: -6px; animation-delay: 0.8s; font-size: 0.9rem; }
    .s4 { bottom: 4px; left: -6px; animation-delay: 0.2s; font-size: 0.9rem; }
    .s5 { top: -6px; left: 45%; animation-delay: 0.6s; font-size: 0.95rem; }
    .s6 { bottom: -4px; left: 52%; animation-delay: 1s; font-size: 0.85rem; }
    .heart-wrap {
      margin: 10px 0;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      transform: translateZ(55px);
      animation: heartbeat 1.4s ease-in-out infinite;
      filter: drop-shadow(0 8px 12px rgba(138, 90, 0, 0.45));
    }
    .gold-heart-svg {
      width: clamp(54px, 13vw, 68px);
      height: clamp(54px, 13vw, 68px);
    }
    .music-btn {
      position: fixed;
      top: max(18px, env(safe-area-inset-top, 18px));
      right: max(18px, env(safe-area-inset-right, 18px));
      background: #fffdf8;
      border: 2px solid #c99a2e;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      font-size: 1.25rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(138, 90, 0, 0.22);
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s ease;
    }
    .music-btn:hover { transform: scale(1.08); }
    .music-hint {
      position: fixed;
      bottom: max(22px, env(safe-area-inset-bottom, 22px));
      font-size: clamp(0.82rem, 2.5vw, 0.95rem);
      font-weight: 500;
      color: #7a4e00;
      background: rgba(255, 253, 248, 0.95);
      border: 1.5px solid #c99a2e;
      padding: 9px 20px;
      border-radius: 25px;
      box-shadow: 0 6px 16px rgba(138, 90, 0, 0.18);
      z-index: 15;
      animation: pulseHint 2s ease-in-out infinite;
      pointer-events: none;
      white-space: nowrap;
    }
    .float-item {
      position: fixed;
      bottom: -40px;
      font-size: 1.2rem;
      opacity: 0;
      pointer-events: none;
      z-index: 2;
      animation: floatUp 6s linear infinite;
    }
    .f1 { left: 12%; animation-delay: 0s; }
    .f2 { left: 28%; animation-delay: 1.5s; font-size: 1rem; }
    .f3 { left: 45%; animation-delay: 3s; }
    .f4 { left: 68%; animation-delay: 0.8s; font-size: 1.3rem; }
    .f5 { left: 84%; animation-delay: 2.2s; }
    .f6 { left: 92%; animation-delay: 4s; font-size: 1rem; }

    @keyframes bgGlitterShimmer {
      0% { background-position: 0 0, 12px 15px, 6px 8px, center; }
      50% { background-position: 13px 13px, 29px 32px, 15px 17px, center; }
      100% { background-position: 26px 26px, 46px 49px, 25px 27px, center; }
    }
    @keyframes cardGlitterShimmer {
      0% { background-position: 0 0, 9px 11px, 4px 6px, center; }
      50% { background-position: 9px 9px, 21px 23px, 11px 13px, center; }
      100% { background-position: 18px 18px, 34px 36px, 18px 20px, center; }
    }
    @keyframes auto3DFloat {
      0%, 100% { transform: rotateX(6deg) rotateY(-8deg); }
      50% { transform: rotateX(-5deg) rotateY(8deg); }
    }
    @keyframes glareSweep {
      0% { left: -150%; }
      45% { left: 160%; }
      100% { left: 160%; }
    }
    @keyframes heavyGlitter {
      0% { background-position: 0 0, 7px 9px, 4px 3px, 220% center; }
      50% { background-position: 14px 7px, 0px 18px, 11px 8px, 110% center; }
      100% { background-position: 28px 14px, 14px 27px, 22px 16px, 0% center; }
    }
    @keyframes twinkleSparkle {
      0%, 100% { opacity: 0.2; transform: scale(0.7) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.35) rotate(25deg); text-shadow: 0 0 10px #ffd700, 0 0 18px #ffea70; }
    }
    @keyframes heartbeat {
      0%, 100% { transform: translateZ(55px) scale(1); }
      50% { transform: translateZ(55px) scale(1.16); }
    }
    @keyframes pulseHint {
      0%, 100% { opacity: 0.75; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.85; }
      100% { transform: translateY(-110vh); opacity: 0; }
    }
  </style>
</head>
