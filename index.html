<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ashish ❤️ Madhu</title>
  <!-- Google Fonts for romantic typography -->
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
    }

    /* Main Glass Card */
    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 55px 40px;
      border-radius: 25px;
      box-shadow: 0 15px 35px rgba(214, 51, 108, 0.2);
      text-align: center;
      max-width: 380px;
      width: 88%;
      z-index: 10;
      border: 2px solid rgba(255, 255, 255, 0.9);
      animation: fadeIn 1.2s ease-in-out;
    }

    .name {
      font-family: 'Dancing Script', cursive;
      font-size: 3.6rem;
      color: #d6336c;
      text-shadow: 2px 2px 4px rgba(214, 51, 108, 0.15);
    }

    /* Beating Heart Animation */
    .heart {
      font-size: 3.2rem;
      margin: 18px 0;
      display: inline-block;
      animation: heartbeat 1.2s infinite;
    }

    /* Subtle Music Toggle Button in Corner */
    .music-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      width: 46px;
      height: 46px;
      font-size: 1.3rem;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(214, 51, 108, 0.2);
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Subtle Mobile Tap Hint */
    .tap-hint {
      position: fixed;
      bottom: 25px;
      font-size: 0.85rem;
      color: #b5174d;
      background: rgba(255, 255, 255, 0.7);
      padding: 6px 16px;
      border-radius: 20px;
      z-index: 15;
      animation: pulseHint 2s infinite;
      pointer-events: none;
    }

    /* Floating Background Hearts */
    .bg-heart {
      position: absolute;
      bottom: -50px;
      font-size: 1.5rem;
      opacity: 0.6;
      animation: floatUp 6s linear infinite;
      pointer-events: none;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.25); }
      50% { transform: scale(1); }
      75% { transform: scale(1.15); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseHint {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body onclick="handleScreenTap()">

  <!-- Mobile-Friendly Audio Player -->
  <audio id="bgMusic" loop playsinline preload="auto">
    <source src="song.mp3" type="audio/mpeg">
  </audio>

  <!-- Corner Music Mute/Play Button -->
  <button class="music-btn" id="musicBtn" onclick="toggleMusic(event)" title="Play/Pause Music">🔇</button>

  <div class="card">
    <div class="name">Ashish</div>
    <div class="heart">❤️</div>
    <div class="name">Madhu</div>
  </div>

  <div class="tap-hint" id="tapHint">Tap anywhere for music 🎵</div>

  <script>
    const music = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');
    const tapHint = document.getElementById('tapHint');
    let isPlaying = false;

    function handleScreenTap() {
      // Burst extra hearts on tap
      for (let i = 0; i < 10; i++) {
        createHeart();
      }

      // Start music on first tap anywhere on mobile or desktop
      if (!isPlaying) {
        music.play().then(() => {
          isPlaying = true;
          musicBtn.innerText = '🎵';
          if (tapHint) tapHint.style.display = 'none';
        }).catch((err) => {
          console.log("Playback waiting for user tap:", err);
        });
      }
    }

    function toggleMusic(event) {
      event.stopPropagation();
      if (isPlaying) {
        music.pause();
        isPlaying = false;
        musicBtn.innerText = '🔇';
      } else {
        music.play().then(() => {
          isPlaying = true;
          musicBtn.innerText = '🎵';
          if (tapHint) tapHint.style.display = 'none';
        });
      }
    }

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('bg-heart');
      const emojis = ['❤️', '💖', '💕', '💗', '💓'];
      heart.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
      heart.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }

    // Continuously generate gentle floating hearts
    setInterval(createHeart, 600);
  </script>

</body>
</html>
