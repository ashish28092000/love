<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ashish 💛 Madhu</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { width: 100%; height: 100%; min-height: 100vh; min-height: 100dvh; overflow: hidden; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #fffdf7 0%, #f9eccb 50%, #f3d999 100%);
      position: relative;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      perspective: 1000px;
    }

    /* 3D Wrapper */
    .card-wrapper {
      z-index: 10;
      width: min(86vw, 370px);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 3D Moving Royal Golden Card */
    .card {
      position: relative;
      overflow: hidden;
      background: rgba(255, 253, 248, 0.94);
      padding: clamp(38px, 8vh, 68px) clamp(32px, 8vw, 62px);
      border-radius: 26px;
      border: 1.5px solid #d4af37;
      box-shadow: 0 18px 42px rgba(184, 134, 11, 0.2), inset 0 0 18px rgba(212, 175, 55, 0.08);
      text-align: center;
      width: 100%;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out, box-shadow 0.2s ease;
      animation: fadeIn 1s ease, auto3DFloat 6s ease-in-out infinite;
    }

    /* 3D Moving Golden Light Glare */
    .glare {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: radial-gradient(
        circle at var(--glare-x, 50%) var(--glare-y, 50%),
        rgba(255, 248, 210, 0.65) 0%,
        rgba(212, 175, 55, 0.15) 35%,
        transparent 70%
      );
      opacity: var(--glare-opacity, 0.35);
      pointer-events: none;
      transition: opacity 0.3s ease;
      mix-blend-mode: overlay;
    }

    /* Wrapper for Name + Sparkles in 3D Depth */
    .name-box {
      position: relative;
      display: inline-block;
      transform: translateZ(32px);
    }

    /* Golden Glitter Shimmer Text */
    .name {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(3rem, 9.5vw, 4.3rem);
      line-height: 1.25;
      background: linear-gradient(
        110deg,
        #8a5a00 10%,
        #d4af37 30%,
        #fff6b3 48%,
        #f7d060 55%,
        #b8860b 75%,
        #8a5a00 90%
      );
      background-size: 220% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 3px 6px rgba(212, 175, 55, 0.35));
      animation: goldGlitter 2.8s linear infinite;
    }

    /* Tiny Twinkling Glitter Stars Around Names */
    .sparkle {
      position: absolute;
      color: #e5b822;
      font-size: 0.9rem;
      pointer-events: none;
      animation: twinkleSparkle 1.8s ease-in-out infinite;
    }
    .s1 { top: 6px; left: -14px; animation-delay: 0s; }
    .s2 { bottom: 10px; right: -14px; animation-delay: 0.6s; }
    .s3 { top: 8px; right: -12px; animation-delay: 1.1s; font-size: 0.75rem; }
    .s4 { bottom: 8px; left: -12px; animation-delay: 0.4s; font-size: 0.75rem; }

    /* Golden Metallic Beating Heart in 3D Depth */
    .heart-wrap {
      margin: 14px 0;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      transform: translateZ(48px);
      animation: heartbeat 1.4s ease-in-out infinite;
      filter: drop-shadow(0 6px 12px rgba(212, 175, 55, 0.45));
    }

    .gold-heart-svg {
      width: clamp(44px, 11vw, 58px);
      height: clamp(44px, 11vw, 58px);
    }

    /* Golden Music Button */
    .music-btn {
      position: fixed;
      top: max(18px, env(safe-area-inset-top, 18px));
      right: max(18px, env(safe-area-inset-right, 18px));
      background: rgba(255, 253, 248, 0.94);
      border: 1.5px solid #d4af37;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(184, 134, 11, 0.16);
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s ease;
    }

    .music-btn:hover {
      transform: scale(1.08);
    }

    /* Golden Music Instruction Pill */
    .music-hint {
      position: fixed;
      bottom: max(22px, env(safe-area-inset-bottom, 22px));
      font-size: clamp(0.8rem, 2.5vw, 0.92rem);
      font-weight: 500;
      color: #8a5a00;
      background: rgba(255, 253, 248, 0.9);
      border: 1.2px solid #d4af37;
      padding: 8px 18px;
      border-radius: 25px;
      box-shadow: 0 4px 14px rgba(184, 134, 11, 0.15);
      z-index: 15;
      animation: pulseHint 2s ease-in-out infinite;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.4s ease;
    }

    /* Gentle Floating Hearts & Sparkles */
    .bg-heart {
      position: fixed;
      bottom: -40px;
      opacity: 0.65;
      animation: floatUp linear forwards;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes auto3DFloat {
      0%, 100% { transform: rotateX(4deg) rotateY(-6deg); }
      50% { transform: rotateX(-4deg) rotateY(6deg); }
    }
    @keyframes goldGlitter {
      0% { background-position: 200% center; }
      100% { background-position: 0% center; }
    }
    @keyframes twinkleSparkle {
      0%, 100% { opacity: 0.15; transform: scale(0.7) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.25) rotate(25deg); text-shadow: 0 0 8px #ffd700; }
    }
    @keyframes heartbeat {
      0%, 100% { transform: translateZ(48px) scale(1); }
      50% { transform: translateZ(48px) scale(1.18); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseHint {
      0%, 100% { opacity: 0.7; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 0.7; }
      100% { transform: translateY(-110vh); opacity: 0; }
    }
  </style>
</head>
<body>
  <audio id="bgMusic" autoplay loop playsinline preload="auto"><source src="song.mp3" type="audio/mpeg"></audio>
  <button class="music-btn" id="musicBtn" aria-label="Toggle Music" title="Play/Pause Music">🔇</button>

  <div class="card-wrapper">
    <div class="card" id="tiltCard">
      <div class="glare" id="cardGlare"></div>
      <div class="name-box">
        <span class="sparkle s1">✦</span>
        <span class="sparkle s2">✦</span>
        <div class="name">Ashish</div>
      </div>
      <br />
      <div class="heart-wrap">
        <svg class="gold-heart-svg" viewBox="0 0 32 29.6" xmlns="http://w3.org">
          <defs>
            <linearGradient id="goldHeartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fff3a8" />
              <stop offset="30%" stop-color="#f5c842" />
              <stop offset="70%" stop-color="#c99316" />
              <stop offset="100%" stop-color="#8a5a00" />
            </linearGradient>
          </defs>
          <path fill="url(#goldHeartGrad)" d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/>
        </svg>
      </div>
      <br />
      <div class="name-box">
        <span class="sparkle s3">✦</span>
        <span class="sparkle s4">✦</span>
        <div class="name">Madhu</div>
      </div>
    </div>
  </div>

  <div class="music-hint" id="musicHint">Tap anywhere for music ✨</div>

  <script>
    const music = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');
    const musicHint = document.getElementById('musicHint');
    const card = document.getElementById('tiltCard');
    const glare = document.getElementById('cardGlare');
    let isPlaying = false;

    // 3D Interactive Tilt & Glare
    function update3DCard(clientX, clientY) {
      card.style.animation = 'none';
      const rect = card.getBoundingClientRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;
      const rotateX = ((y - rect.height / 2) / (rect.height / 2)) * -14;
      const rotateY = ((x - rect.width / 2) / (rect.width / 2)) * 14;
      card.style.transform = `rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg)`;
      glare.style.setProperty('--glare-x', `${(x / rect.width) * 100}%`);
      glare.style.setProperty('--glare-y', `${(y / rect.height) * 100}%`);
      glare.style.setProperty('--glare-opacity', '0.85');
    }

    function reset3DCard() {
      card.style.transform = '';
      card.style.animation = 'auto3DFloat 6s ease-in-out infinite';
      glare.style.setProperty('--glare-opacity', '0.35');
    }

    document.addEventListener('mousemove', e => update3DCard(e.clientX, e.clientY));
    document.addEventListener('mouseleave', reset3DCard);
    document.addEventListener('touchmove', e => {
      if (e.touches.length > 0) update3DCard(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    document.addEventListener('touchend', reset3DCard);

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('bg-heart');
      const items = ['💛', '✨', '✦'];
      heart.innerText = items[Math.floor(Math.random() * items.length)];
      heart.style.left = (Math.random() * 94 + 2) + 'vw';
      const duration = Math.random() * 3 + 5;
      heart.style.animationDuration = duration + 's';
heart.style.fontSize = (Math.random() * 0.8 + 0.9) + 'rem';
document.body.appendChild(heart);
setTimeout(() => heart.remove(), duration * 1000);
}
setInterval(createHeart, 850);
function playMusic() {
if (!isPlaying) {
music.play().then(() => {
isPlaying = true;
musicBtn.innerText = '🎵';
if (musicHint) {
musicHint.style.opacity = '0';
setTimeout(() => { musicHint.style.display = 'none'; }, 400);
}
}).catch(() => {});
}
}
window.addEventListener('load', playMusic);
document.addEventListener('touchstart', playMusic, { once: true, passive: true });
document.addEventListener('click', playMusic, { once: true });
musicBtn.addEventListener('click', e => {
e.stopPropagation();
if (isPlaying) {
music.pause();
isPlaying = false;
musicBtn.innerText = '🔇';
} else {
music.play().then(() => {
isPlaying = true;
musicBtn.innerText = '🎵';
if (musicHint) {
musicHint.style.opacity = '0';
setTimeout(() => { musicHint.style.display = 'none'; }, 400);
}
}).catch(() => {});
}
});
