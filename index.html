<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ashish ❤️ Madhu</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { width: 100%; height: 100%; min-height: 100vh; min-height: 100dvh; overflow: hidden; background: #060714; }
    body { display: flex; justify-content: center; align-items: center; padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px); position: relative; cursor: pointer; font-family: 'Poppins', sans-serif; perspective: 1000px; }
    
    /* Fullscreen Fireworks Canvas */
    #fireworksCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

    /* Center 3D Glass Card */
    .card-wrapper { z-index: 10; width: min(88vw, 400px); display: flex; justify-content: center; align-items: center; pointer-events: none; }
    .card { position: relative; overflow: hidden; background: rgba(15, 17, 32, 0.55); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: clamp(30px, 6.5vh, 60px) clamp(24px, 6vw, 50px); border-radius: clamp(20px, 4vw, 28px); text-align: center; width: 100%; max-height: 85dvh; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 2px solid rgba(255, 105, 180, 0.7); transform-style: preserve-3d; transition: transform 0.15s ease-out; animation: fadeIn 1.2s ease-in-out, neonCardBlink 1.8s ease-in-out infinite alternate; }
    
    .glare { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: inherit; background: radial-gradient(circle at var(--glare-x, 50%) var(--glare-y, 50%), rgba(255, 255, 255, 0.32) 0%, rgba(255, 105, 180, 0.15) 35%, transparent 70%); opacity: var(--glare-opacity, 0.35); pointer-events: none; mix-blend-mode: screen; }

    .name { font-family: 'Dancing Script', cursive; font-size: clamp(2.8rem, 9vw, 4.2rem); line-height: 1.15; color: #ffb3c6; word-break: break-word; transform: translateZ(35px); animation: neonTextBlink 1.8s ease-in-out infinite alternate; }
    .heart { font-size: clamp(2.4rem, 7vw, 3.6rem); margin: clamp(12px, 3vh, 22px) 0; display: inline-block; filter: drop-shadow(0 0 18px rgba(255, 50, 100, 0.95)); animation: heartbeat 1.1s infinite; transform: translateZ(50px); }

    /* Music Button */
    .music-btn { position: fixed; top: max(16px, env(safe-area-inset-top, 16px)); right: max(16px, env(safe-area-inset-right, 16px)); background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(8px); border: 1.5px solid rgba(255, 182, 193, 0.5); border-radius: 50%; width: clamp(42px, 6vw, 50px); height: clamp(42px, 6vw, 50px); font-size: clamp(1.1rem, 3vw, 1.4rem); color: #fff; cursor: pointer; box-shadow: 0 0 18px rgba(255, 105, 180, 0.45); z-index: 20; display: flex; justify-content: center; align-items: center; transition: transform 0.2s ease; }
    .music-btn:hover { transform: scale(1.08); }

    /* Tap Hint */
    .tap-hint { position: fixed; bottom: max(20px, env(safe-area-inset-bottom, 20px)); font-size: clamp(0.8rem, 2.5vw, 0.95rem); color: #ffd1dc; background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 182, 193, 0.35); padding: 8px 18px; border-radius: 25px; z-index: 15; animation: pulseHint 2s infinite; pointer-events: none; white-space: nowrap; }

    @media (max-height: 480px) and (orientation: landscape) {
      .card { padding: 18px 36px; }
      .card-wrapper { width: min(75vw, 380px); }
      .name { font-size: 2.4rem; }
      .heart { font-size: 2rem; margin: 6px 0; }
    }

    @keyframes neonCardBlink {
      0% { border-color: rgba(255, 105, 180, 0.35); box-shadow: 0 0 15px rgba(255, 105, 180, 0.2); }
      100% { border-color: rgba(255, 130, 195, 1); box-shadow: 0 0 40px rgba(255, 105, 180, 0.65), 0 0 75px rgba(255, 20, 147, 0.35); }
    }
    @keyframes neonTextBlink {
      0% { color: #ff85a2; text-shadow: 0 0 8px rgba(255, 105, 180, 0.5); }
      100% { color: #ffd6e0; text-shadow: 0 0 16px rgba(255, 105, 180, 1), 0 0 34px rgba(255, 20, 147, 0.85); }
    }
    @keyframes heartbeat { 0%, 100% { transform: translateZ(50px) scale(1); } 25% { transform: translateZ(50px) scale(1.28); } 50% { transform: translateZ(50px) scale(1); } 75% { transform: translateZ(50px) scale(1.18); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulseHint { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <audio id="bgMusic" loop playsinline preload="auto"><source src="song.mp3" type="audio/mpeg"></audio>
  <button class="music-btn" id="musicBtn" aria-label="Toggle Music" title="Play/Pause Music">🔇</button>
  <canvas id="fireworksCanvas"></canvas>

  <div class="card-wrapper">
    <div class="card" id="tiltCard">
      <div class="glare" id="cardGlare"></div>
      <div class="name">Ashish</div>
      <div class="heart">❤️</div>
      <div class="name">Madhu</div>
    </div>
  </div>

  <div class="tap-hint" id="tapHint">Tap sky for fireworks & music 🎆</div>

  <script>
    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');
    const music = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');
    const tapHint = document.getElementById('tapHint');
    const card = document.getElementById('tiltCard');
    const glare = document.getElementById('cardGlare');

    let width, height;
    let isPlaying = false;
    let lastInteraction = 0;

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Background Twinkling Stars
    const stars = Array.from({ length: 110 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 1.6 + 0.4,
      alpha: Math.random(),
      speed: Math.random() * 0.02 + 0.005
    }));

    const particles = [];
    const rockets = [];
    const colors = ['#ff2a6d', '#ff69b4', '#ff9ebb', '#ffd700', '#ff4d6d', '#c77dff', '#ff758f'];

    // Heart Shape Math Formula for Fireworks Burst
    function createHeartFirework(x, y) {
      const color = colors[Math.floor(Math.random() * colors.length)];
      const secondaryColor = colors[Math.floor(Math.random() * colors.length)];
      const count = 75;
      const scale = Math.min(width, height) * 0.009 + 4.5;

      for (let i = 0; i < count; i++) {
        const t = (Math.PI * 2 * i) / count;
        const hx = 16 * Math.pow(Math.sin(t), 3);
        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        
        const speedSpread = 0.85 + Math.random() * 0.35;
        particles.push({
          x: x,
          y: y,
          vx: (hx * scale * 0.035) * speedSpread,
          vy: (hy * scale * 0.035) * speedSpread,
          alpha: 1,
          decay: Math.random() * 0.012 + 0.011,
          color: i % 2 === 0 ? color : secondaryColor,
          size: Math.random() * 2.5 + 1.8
        });
      }
    }

    // Launch Rocket from Bottom
    function launchRocket(targetX, targetY) {
      const startX = targetX !== undefined ? targetX + (Math.random() * 80 - 40) : Math.random() * (width * 0.8) + width * 0.1;
      const destX = targetX !== undefined ? targetX : startX + (Math.random() * 100 - 50);
      const destY = targetY !== undefined ? targetY : Math.random() * (height * 0.45) + height * 0.12;
      
      rockets.push({
        x: startX,
        y: height,
        tx: destX,
        ty: destY,
        vx: (destX - startX) / 35,
        vy: (destY - height) / 35,
        color: colors[Math.floor(Math.random() * colors.length)],
        trail: []
      });
    }

    function animate() {
      ctx.fillStyle = 'rgba(6, 7, 20, 0.22)';
      ctx.fillRect(0, 0, width, height);

      // Draw Stars
      stars.forEach(s => {
        s.alpha += s.speed;
        if (s.alpha > 1 || s.alpha < 0.1) s.speed = -s.speed;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.1, s.alpha)})`;
        ctx.fill();
      });

      // Update & Draw Rockets
      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.trail.push({ x: r.x, y: r.y });
        if (r.trail.length > 6) r.trail.shift();

        r.x += r.vx;
        r.y += r.vy;

        ctx.beginPath();
        r.trail.forEach((pt, idx) => {
          if (idx === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.strokeStyle = r.color;
        ctx.lineWidth = 2.5;
        ctx.stroke();

        if (r.y <= r.ty) {
          createHeartFirework(r.x, r.y);
          rockets.splice(i, 1);
        }
      }

      // Update & Draw Heart Firework Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.035; // Gentle gravity
        p.vx *= 0.985;
        p.vy *= 0.985;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.shadowBlur = 12;
        ctx.shadowColor = p.color;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
ctx.restore();
}
requestAnimationFrame(animate);
}
animate();
// Auto Launch Fireworks Every 1.4 Seconds
setInterval(() => {
launchRocket();
}, 1400);
// Initial Welcome Fireworks
setTimeout(() => launchRocket(width * 0.25, height * 0.25), 300);
setTimeout(() => launchRocket(width * 0.75, height * 0.25), 700);
// 3D Tilt & Glare Effect
function update3DCard(clientX, clientY) {
const rect = card.getBoundingClientRect();
const x = clientX - rect.left;
const y = clientY - rect.top;
const rotateX = ((y - rect.height / 2) / (rect.height / 2)) * -15;
const rotateY = ((x - rect.width / 2) / (rect.width / 2)) * 15;
card.style.transform = rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg);
glare.style.setProperty('--glare-x', ${(x / rect.width) * 100}%);
glare.style.setProperty('--glare-y', ${(y / rect.height) * 100}%);
glare.style.setProperty('--glare-opacity', '0.85');
}
function reset3DCard() {
card.style.transform = 'rotateX(0deg) rotateY(0deg)';
glare.style.setProperty('--glare-opacity', '0.3');
}
document.addEventListener('mousemove', e => update3DCard(e.clientX, e.clientY));
document.addEventListener('mouseleave', reset3DCard);
document.addEventListener('touchmove', e => { if (e.touches.length > 0) update3DCard(e.touches.clientX, e.touches.clientY); }, { passive: true });
document.addEventListener('touchend', reset3DCard);
// Audio & Tap Firework Burst
function startAudio() {
if (!isPlaying) {
music.play().then(() => {
isPlaying = true;
musicBtn.innerText = '🎵';
if (tapHint) tapHint.style.display = 'none';
}).catch(() => {});
}
}
function handleTap(clientX, clientY, target) {
if (target.closest('#musicBtn')) return;
const now = Date.now();
if (now - lastInteraction < 200) return;
lastInteraction = now;
createHeartFirework(clientX, clientY);
startAudio();
}
document.body.addEventListener('touchstart', e => {
if (e.touches.length > 0) {
update3DCard(e.touches.clientX, e.touches.clientY);
handleTap(e.touches.clientX, e.touches.clientY, e.target);
}
}, { passive: true });
document.body.addEventListener('click', e => {
handleTap(e.clientX, e.clientY, e.target);
});
musicBtn.addEventListener('click', e => {
e.stopPropagation();
if (isPlaying) {
music.pause();
isPlaying = false;
musicBtn.innerText = '🔇';
} else {
music.play().then(() => {
isPlaying = true;
musicBtn.innerText = '🎵';
if (tapHint) tapHint.style.display = 'none';
}).catch(() => {});
}
});
